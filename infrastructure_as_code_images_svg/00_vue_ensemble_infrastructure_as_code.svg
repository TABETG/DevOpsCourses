<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050">
<rect width="100%" height="100%" fill="#F4F6FA"/>
<rect width="1600" height="190" fill="#0F2F5A"/>
<text x="70" y="72" font-size="48" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Infrastructure as Code — Niveau 3</text>
<text x="70" y="125" font-size="27" font-weight="500" fill="#D7E8FF" font-family="Inter,Arial,sans-serif" text-anchor="start">Terraform/OpenTofu • Ansible • Packer/Vagrant • Immutabilité, drift et GitOps</text>
<rect x="45" y="225" width="1510" height="360" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="225" width="1510" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="257" r="24" fill="#2563EB"/>
<text x="87" y="266" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="125" y="267" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">La chaîne mentale à retenir</text>
<circle cx="175" cy="365" r="58" fill="#2563EB"/>
<text x="175" y="376" font-size="42" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="175" y="470" font-size="30" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Terraform</text>
<text x="175" y="510" font-size="22" font-weight="800" fill="#2563EB" font-family="Inter,Arial,sans-serif" text-anchor="middle">CRÉE</text>
<text x="175" y="548" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">VM • réseau • base • LB</text>
<text x="290" y="380" font-size="48" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<circle cx="535" cy="365" r="58" fill="#16A36A"/>
<text x="535" y="376" font-size="42" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">2</text>
<text x="535" y="470" font-size="30" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Ansible</text>
<text x="535" y="510" font-size="22" font-weight="800" fill="#16A36A" font-family="Inter,Arial,sans-serif" text-anchor="middle">CONFIGURE</text>
<text x="535" y="548" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">paquets • fichiers • services</text>
<text x="650" y="380" font-size="48" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<circle cx="895" cy="365" r="58" fill="#F59E0B"/>
<text x="895" y="376" font-size="42" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">3</text>
<text x="895" y="470" font-size="30" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Packer</text>
<text x="895" y="510" font-size="22" font-weight="800" fill="#F59E0B" font-family="Inter,Arial,sans-serif" text-anchor="middle">FABRIQUE</text>
<text x="895" y="548" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">golden images de VM</text>
<text x="1010" y="380" font-size="48" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<circle cx="1255" cy="365" r="58" fill="#7C3AED"/>
<text x="1255" y="376" font-size="42" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">4</text>
<text x="1255" y="470" font-size="30" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">GitOps</text>
<text x="1255" y="510" font-size="22" font-weight="800" fill="#7C3AED" font-family="Inter,Arial,sans-serif" text-anchor="middle">RÉCONCILIE</text>
<text x="1255" y="548" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">Git = état désiré</text>
<rect x="45" y="620" width="730" height="560" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="620" width="730" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="652" r="24" fill="#2563EB"/>
<text x="87" y="661" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">16</text>
<text x="125" y="662" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 16 — Terraform / OpenTofu</text>
<circle cx="90" cy="712" r="6" fill="#16A36A"/>
<text x="108" y="720" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Comparer trois choses : code, state et réalité.</text>
<circle cx="90" cy="752" r="6" fill="#16A36A"/>
<text x="108" y="760" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Toujours faire plan avant apply.</text>
<circle cx="90" cy="792" r="6" fill="#16A36A"/>
<text x="108" y="800" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">State distant, chiffré, verrouillé ; jamais dans</text>
<text x="108" y="832" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Git.</text>
<circle cx="90" cy="864" r="6" fill="#16A36A"/>
<text x="108" y="872" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">for_each plutôt que count pour garder des clés</text>
<text x="108" y="904" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">stables.</text>
<circle cx="90" cy="936" r="6" fill="#16A36A"/>
<text x="108" y="944" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Réparer avec import, moved, state mv, force-unlock.</text>
<circle cx="90" cy="976" r="6" fill="#16A36A"/>
<text x="108" y="984" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">En production : apply depuis la CI après revue du</text>
<text x="108" y="1016" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">plan.</text>
<rect x="80" y="970" width="650" height="237" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="102" y="1008" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Commandes de base</text>
<text x="102" y="1040" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform init</text>
<text x="102" y="1069" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform fmt -check -recursive</text>
<text x="102" y="1098" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform validate</text>
<text x="102" y="1127" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform plan -out=tfplan</text>
<text x="102" y="1156" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform apply tfplan</text>
<rect x="825" y="620" width="730" height="560" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="825" y="620" width="730" height="64" rx="24" fill="#16A36A" opacity="0.12"/>
<circle cx="867" cy="652" r="24" fill="#16A36A"/>
<text x="867" y="661" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">17</text>
<text x="905" y="662" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 17 — Ansible</text>
<circle cx="870" cy="712" r="6" fill="#16A36A"/>
<text x="888" y="720" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Configuration par SSH, sans agent.</text>
<circle cx="870" cy="752" r="6" fill="#16A36A"/>
<text x="888" y="760" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Idempotence : relancer ne change rien si l&#x27;état est</text>
<text x="888" y="792" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">déjà bon.</text>
<circle cx="870" cy="824" r="6" fill="#16A36A"/>
<text x="888" y="832" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Inventaire → playbook → rôles → handlers →</text>
<text x="888" y="864" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">templates.</text>
<circle cx="870" cy="896" r="6" fill="#16A36A"/>
<text x="888" y="904" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Secrets avec Ansible Vault ; clé jamais commitée.</text>
<circle cx="870" cy="936" r="6" fill="#16A36A"/>
<text x="888" y="944" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Molecule + ansible-lint en CI.</text>
<circle cx="870" cy="976" r="6" fill="#16A36A"/>
<text x="888" y="984" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Aujourd&#x27;hui : prépare les hôtes et orchestre les</text>
<text x="888" y="1016" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">opérations.</text>
<rect x="860" y="970" width="650" height="150" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="882" y="1008" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Exemple</text>
<text x="882" y="1040" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">ansible all -i inventory.ini -m ping</text>
<text x="882" y="1069" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">ansible-playbook -i inventory/prod.ini playbooks/web.yml --check --diff</text>
<rect x="45" y="1215" width="730" height="520" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="1215" width="730" height="64" rx="24" fill="#F59E0B" opacity="0.12"/>
<circle cx="87" cy="1247" r="24" fill="#F59E0B"/>
<text x="87" y="1256" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">18</text>
<text x="125" y="1257" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 18 — Packer / Vagrant</text>
<circle cx="90" cy="1307" r="6" fill="#16A36A"/>
<text x="108" y="1315" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Packer construit une image de VM comme Docker</text>
<text x="108" y="1347" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">construit une image de conteneur.</text>
<circle cx="90" cy="1379" r="6" fill="#16A36A"/>
<text x="108" y="1387" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Golden image : construite, scannée, taguée, consommée</text>
<text x="108" y="1419" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">par Terraform.</text>
<circle cx="90" cy="1451" r="6" fill="#16A36A"/>
<text x="108" y="1459" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">On remplace les VM au lieu de les patcher.</text>
<circle cx="90" cy="1491" r="6" fill="#16A36A"/>
<text x="108" y="1499" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Vagrant : à connaître pour les VM de dev et tests</text>
<text x="108" y="1531" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">multi-OS ; moins central aujourd&#x27;hui.</text>
<text x="95" y="1635" font-size="24" font-weight="800" fill="#9A5B00" font-family="Inter,Arial,sans-serif" text-anchor="start">Pipeline : base → provisioners → scan → AMI/VMDK → Terraform</text>
<rect x="825" y="1215" width="730" height="520" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="825" y="1215" width="730" height="64" rx="24" fill="#7C3AED" opacity="0.12"/>
<circle cx="867" cy="1247" r="24" fill="#7C3AED"/>
<text x="867" y="1256" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">19</text>
<text x="905" y="1257" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 19 — Immutabilité, drift et GitOps</text>
<circle cx="870" cy="1307" r="6" fill="#16A36A"/>
<text x="888" y="1315" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Immuable : tout changement = nouvelle image +</text>
<text x="888" y="1347" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">nouvelle instance.</text>
<circle cx="870" cy="1379" r="6" fill="#16A36A"/>
<text x="888" y="1387" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Drift : écart entre Git/code et la réalité.</text>
<circle cx="870" cy="1419" r="6" fill="#16A36A"/>
<text x="888" y="1427" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Détecter par plan nocturne, prévenir par</text>
<text x="888" y="1459" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">droits/politiques, traiter sans laisser l&#x27;écart.</text>
<circle cx="870" cy="1491" r="6" fill="#16A36A"/>
<text x="888" y="1499" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">GitOps : déclaratif, versionné, pull par agent,</text>
<text x="888" y="1531" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">réconciliation continue.</text>
<circle cx="870" cy="1563" r="6" fill="#16A36A"/>
<text x="888" y="1571" font-size="23" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Séparer dépôt applicatif et dépôt de configuration.</text>
<rect x="0" y="1955" width="1600" height="95" fill="#0F2F5A"/><text x="70" y="2014" font-size="30" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Objectif : ne plus « cliquer » l&#x27;infrastructure — la décrire, la tester, la versionner et la réconcilier.</text>
</svg>