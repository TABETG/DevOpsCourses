<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050">
<rect width="100%" height="100%" fill="#F4F6FA"/>
<rect width="1600" height="190" fill="#0F2F5A"/>
<text x="70" y="72" font-size="48" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 19 — Immutabilité, dérive et GitOps</text>
<text x="70" y="125" font-size="27" font-weight="500" fill="#D7E8FF" font-family="Inter,Arial,sans-serif" text-anchor="start">Remplacer au lieu de patcher • Détecter le drift • Git comme source de vérité</text>
<rect x="45" y="220" width="730" height="430" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="220" width="730" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="252" r="24" fill="#2563EB"/>
<text x="87" y="261" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="125" y="262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">1. Mutable vs immuable</text>
<text x="90" y="320" font-size="28" font-weight="800" fill="#DC2626" font-family="Inter,Arial,sans-serif" text-anchor="start">Serveur mutable</text>
<circle cx="100" cy="362" r="6" fill="#DC2626"/>
<text x="118" y="370" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Patchs et hotfix SSH au fil du temps.</text>
<circle cx="100" cy="400" r="6" fill="#DC2626"/>
<text x="118" y="408" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Devient un « snowflake » unique et difficile à</text>
<text x="118" y="438" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">reproduire.</text>
<circle cx="100" cy="468" r="6" fill="#DC2626"/>
<text x="118" y="476" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Le rollback devient risqué.</text>
<text x="90" y="510" font-size="28" font-weight="800" fill="#16A36A" font-family="Inter,Arial,sans-serif" text-anchor="start">Serveur immuable</text>
<circle cx="100" cy="552" r="6" fill="#16A36A"/>
<text x="118" y="560" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Tout changement = nouvelle image + nouvelle</text>
<text x="118" y="590" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">instance.</text>
<circle cx="100" cy="620" r="6" fill="#16A36A"/>
<text x="118" y="628" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Logs et données vivent hors de l&#x27;instance.</text>
<circle cx="100" cy="658" r="6" fill="#16A36A"/>
<text x="118" y="666" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Rollback = redéployer l&#x27;image précédente.</text>
<rect x="825" y="220" width="730" height="430" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="825" y="220" width="730" height="64" rx="24" fill="#F59E0B" opacity="0.12"/>
<circle cx="867" cy="252" r="24" fill="#F59E0B"/>
<text x="867" y="261" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">2</text>
<text x="905" y="262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">2. Drift : le code devient menteur</text>
<circle cx="870" cy="322" r="6" fill="#16A36A"/>
<text x="888" y="330" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Détecter : terraform plan planifié, ansible</text>
<text x="888" y="362" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">--check, ArgoCD OutOfSync.</text>
<circle cx="870" cy="394" r="6" fill="#16A36A"/>
<text x="888" y="402" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Prévenir : pas d&#x27;écriture console prod, politiques</text>
<text x="888" y="434" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">SCP/Azure Policy/OPA.</text>
<circle cx="870" cy="466" r="6" fill="#16A36A"/>
<text x="888" y="474" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Traiter : soit modifier le code, soit réaligner la</text>
<text x="888" y="506" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">réalité — jamais laisser l&#x27;écart.</text>
<rect x="45" y="685" width="1510" height="430" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="685" width="1510" height="64" rx="24" fill="#7C3AED" opacity="0.12"/>
<circle cx="87" cy="717" r="24" fill="#7C3AED"/>
<text x="87" y="726" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">3</text>
<text x="125" y="727" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">3. Les 4 principes GitOps</text>
<circle cx="245" cy="820" r="50" fill="#2563EB"/>
<text x="245" y="833" font-size="34" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="245" y="905" font-size="27" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Déclaratif</text>
<text x="245" y="945" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">l&#x27;état désiré est décrit</text>
<circle cx="615" cy="820" r="50" fill="#16A36A"/>
<text x="615" y="833" font-size="34" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">2</text>
<text x="615" y="905" font-size="27" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Versionné</text>
<text x="615" y="945" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">Git conserve l&#x27;historique</text>
<circle cx="985" cy="820" r="50" fill="#F59E0B"/>
<text x="985" y="833" font-size="34" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">3</text>
<text x="985" y="905" font-size="27" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Pull</text>
<text x="985" y="945" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">un agent lit Git</text>
<circle cx="1355" cy="820" r="50" fill="#7C3AED"/>
<text x="1355" y="833" font-size="34" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">4</text>
<text x="1355" y="905" font-size="27" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">Réconciliation</text>
<text x="1355" y="945" font-size="19" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">l&#x27;agent corrige l&#x27;écart</text>
<rect x="45" y="1150" width="730" height="580" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="1150" width="730" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="1182" r="24" fill="#2563EB"/>
<text x="87" y="1191" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">4</text>
<text x="125" y="1192" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">4. Push CI classique vs Pull GitOps</text>
<text x="250" y="1260" font-size="24" font-weight="800" fill="#2563EB" font-family="Inter,Arial,sans-serif" text-anchor="middle">Push CI</text>
<text x="570" y="1260" font-size="24" font-weight="800" fill="#7C3AED" font-family="Inter,Arial,sans-serif" text-anchor="middle">Pull GitOps</text>
<text x="90" y="1305" font-size="20" font-weight="700" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Qui déploie</text>
<text x="270" y="1305" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Pipeline</text>
<text x="565" y="1305" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Agent dans le cluster</text>
<text x="90" y="1379" font-size="20" font-weight="700" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Secrets prod</text>
<text x="270" y="1379" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">dans la CI</text>
<text x="565" y="1379" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">pas nécessaires à la CI</text>
<text x="90" y="1453" font-size="20" font-weight="700" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Dérive</text>
<text x="270" y="1453" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">au prochain déploiement</text>
<text x="565" y="1453" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">corrigée en continu</text>
<text x="90" y="1527" font-size="20" font-weight="700" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Rollback</text>
<text x="270" y="1527" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">relancer ancien pipeline</text>
<text x="565" y="1527" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">git revert</text>
<text x="90" y="1601" font-size="20" font-weight="700" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Audit</text>
<text x="270" y="1601" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">logs de CI</text>
<text x="565" y="1601" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">historique Git</text>
<rect x="825" y="1150" width="730" height="580" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="825" y="1150" width="730" height="64" rx="24" fill="#16A36A" opacity="0.12"/>
<circle cx="867" cy="1182" r="24" fill="#16A36A"/>
<text x="867" y="1191" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">5</text>
<text x="905" y="1192" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">5. Deux dépôts</text>
<rect x="855" y="1260" width="670" height="422" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="877" y="1298" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Structure recommandée</text>
<text x="877" y="1330" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">crisisshield/</text>
<text x="877" y="1360" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  code + Dockerfile + pipeline CI</text>
<text x="877" y="1390" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  CI → image sha-abc123</text>
<text x="877" y="1420" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">       ↓ met à jour le dépôt config</text>
<text x="877" y="1450" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="877" y="1480" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">crisisshield-config/</text>
<text x="877" y="1510" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">├── base/</text>
<text x="877" y="1540" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">├── envs/</text>
<text x="877" y="1570" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">│   ├── staging/  image: sha-abc123</text>
<text x="877" y="1600" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">│   └── prod/     image: sha-9f8e7d6</text>
<text x="877" y="1630" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">└── infra/        Terraform</text>
<circle cx="865" cy="1652" r="6" fill="#16A36A"/>
<text x="883" y="1660" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Promotion staging → prod = merge request dans le</text>
<text x="883" y="1689" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">dépôt config.</text>
<circle cx="865" cy="1718" r="6" fill="#16A36A"/>
<text x="883" y="1726" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Secrets : SOPS / Sealed Secrets / External</text>
<text x="883" y="1755" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Secrets, jamais en clair.</text>
<circle cx="865" cy="1784" r="6" fill="#16A36A"/>
<text x="883" y="1792" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Un changement manuel d&#x27;urgence doit revenir dans</text>
<text x="883" y="1821" font-size="20" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Git.</text>
<rect x="0" y="1955" width="1600" height="95" fill="#0F2F5A"/><text x="70" y="2014" font-size="30" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">GitOps : Git dit ce qui DOIT exister ; l&#x27;agent vérifie en continu ce qui EXISTE réellement.</text>
</svg>