<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050">
<rect width="100%" height="100%" fill="#F4F6FA"/>
<rect width="1600" height="190" fill="#0F2F5A"/>
<text x="70" y="72" font-size="48" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 18 — Packer et Vagrant</text>
<text x="70" y="125" font-size="27" font-weight="500" fill="#D7E8FF" font-family="Inter,Arial,sans-serif" text-anchor="start">Golden images, construction d&#x27;AMI et environnements de VM reproductibles</text>
<rect x="45" y="220" width="1510" height="330" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="220" width="1510" height="64" rx="24" fill="#F59E0B" opacity="0.12"/>
<circle cx="87" cy="252" r="24" fill="#F59E0B"/>
<text x="87" y="261" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="125" y="262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">1. Packer = Dockerfile pour les VM</text>
<rect x="80" y="335" width="245" height="105" rx="16" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="202" y="372" font-size="24" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Source</text>
<text x="202" y="410" font-size="18" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Ubuntu AMI / ISO</text>
<text x="340" y="392" font-size="30" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="380" y="335" width="245" height="105" rx="16" fill="#16A36A" stroke="#16A36A" stroke-width="1"/>
<text x="502" y="372" font-size="24" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Provisioners</text>
<text x="502" y="410" font-size="18" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Shell + Ansible</text>
<text x="640" y="392" font-size="30" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="680" y="335" width="245" height="105" rx="16" fill="#F59E0B" stroke="#F59E0B" stroke-width="1"/>
<text x="802" y="372" font-size="24" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Validation</text>
<text x="802" y="410" font-size="18" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">scan + tests</text>
<text x="940" y="392" font-size="30" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="980" y="335" width="245" height="105" rx="16" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="1102" y="372" font-size="24" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Artifact</text>
<text x="1102" y="410" font-size="18" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">AMI / VMDK / image</text>
<text x="1240" y="392" font-size="30" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="1280" y="335" width="245" height="105" rx="16" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<text x="1402" y="372" font-size="24" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">Terraform</text>
<text x="1402" y="410" font-size="18" font-weight="600" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">consomme l&#x27;image</text>
<rect x="45" y="585" width="980" height="860" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="585" width="980" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="617" r="24" fill="#2563EB"/>
<text x="87" y="626" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">2</text>
<text x="125" y="627" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">2. Exemple Packer HCL</text>
<rect x="75" y="680" width="920" height="846" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="97" y="718" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">ubuntu-docker.pkr.hcl</text>
<text x="97" y="750" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">packer {</text>
<text x="97" y="779" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  required_plugins {</text>
<text x="97" y="808" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    amazon  = { source = &quot;github.com/hashicorp/amazon&quot;, version = &quot;~&gt; 1&quot; }</text>
<text x="97" y="837" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    ansible = { source = &quot;github.com/hashicorp/ansible&quot;, version = &quot;~&gt; 1&quot; }</text>
<text x="97" y="866" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  }</text>
<text x="97" y="895" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">}</text>
<text x="97" y="924" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="97" y="953" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">variable &quot;region&quot; { default = &quot;eu-west-3&quot; }</text>
<text x="97" y="982" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="97" y="1011" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">source &quot;amazon-ebs&quot; &quot;ubuntu&quot; {</text>
<text x="97" y="1040" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  region        = var.region</text>
<text x="97" y="1069" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  instance_type = &quot;t3.small&quot;</text>
<text x="97" y="1098" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  ssh_username  = &quot;ubuntu&quot;</text>
<text x="97" y="1127" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  ami_name      = &quot;crisisshield-node-{{timestamp}}&quot;</text>
<text x="97" y="1156" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  tags = {</text>
<text x="97" y="1185" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    Project = &quot;crisisshield&quot;</text>
<text x="97" y="1214" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    BuiltBy = &quot;packer&quot;</text>
<text x="97" y="1243" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  }</text>
<text x="97" y="1272" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">}</text>
<text x="97" y="1301" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="97" y="1330" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">build {</text>
<text x="97" y="1359" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  sources = [&quot;source.amazon-ebs.ubuntu&quot;]</text>
<text x="97" y="1388" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  provisioner &quot;ansible&quot; {</text>
<text x="97" y="1417" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    playbook_file = &quot;playbooks/base.yml&quot;</text>
<text x="97" y="1446" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  }</text>
<text x="97" y="1475" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">}</text>
<rect x="1060" y="585" width="495" height="510" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="1060" y="585" width="495" height="64" rx="24" fill="#16A36A" opacity="0.12"/>
<circle cx="1102" cy="617" r="24" fill="#16A36A"/>
<text x="1102" y="626" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">3</text>
<text x="1140" y="627" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">3. Cycle de vie d&#x27;une golden image</text>
<circle cx="1100" cy="682" r="6" fill="#16A36A"/>
<text x="1118" y="690" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Packer construit une nouvelle</text>
<text x="1118" y="720" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">image.</text>
<circle cx="1100" cy="750" r="6" fill="#16A36A"/>
<text x="1118" y="758" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Scan de vulnérabilités.</text>
<circle cx="1100" cy="788" r="6" fill="#16A36A"/>
<text x="1118" y="796" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Tag et publication.</text>
<circle cx="1100" cy="826" r="6" fill="#16A36A"/>
<text x="1118" y="834" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Terraform remplace les</text>
<text x="1118" y="864" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">instances en rolling.</text>
<circle cx="1100" cy="894" r="6" fill="#16A36A"/>
<text x="1118" y="902" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Anciennes images gardées pour</text>
<text x="1118" y="932" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">rollback puis supprimées.</text>
<rect x="1060" y="1120" width="495" height="325" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="1060" y="1120" width="495" height="64" rx="24" fill="#7C3AED" opacity="0.12"/>
<circle cx="1102" cy="1152" r="24" fill="#7C3AED"/>
<text x="1102" y="1161" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">4</text>
<text x="1140" y="1162" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">4. Commandes</text>
<rect x="1090" y="1210" width="435" height="182" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="1112" y="1248" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Exécution</text>
<text x="1112" y="1280" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">packer init .</text>
<text x="1112" y="1310" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">packer validate .</text>
<text x="1112" y="1340" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">packer build .</text>
<rect x="45" y="1480" width="1510" height="420" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="1480" width="1510" height="64" rx="24" fill="#7C3AED" opacity="0.12"/>
<circle cx="87" cy="1512" r="24" fill="#7C3AED"/>
<text x="87" y="1521" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">5</text>
<text x="125" y="1522" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">5. Vagrant : à connaître</text>
<rect x="75" y="1570" width="820" height="372" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="97" y="1608" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Vagrantfile</text>
<text x="97" y="1640" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Vagrant.configure(&quot;2&quot;) do |config|</text>
<text x="97" y="1668" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  config.vm.box = &quot;ubuntu/jammy64&quot;</text>
<text x="97" y="1696" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  config.vm.network &quot;private_network&quot;, ip: &quot;192.168.56.10&quot;</text>
<text x="97" y="1724" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  config.vm.provider &quot;virtualbox&quot; do |vb|</text>
<text x="97" y="1752" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    vb.memory = 2048</text>
<text x="97" y="1780" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  end</text>
<text x="97" y="1808" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  config.vm.provision &quot;ansible&quot; do |a|</text>
<text x="97" y="1836" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    a.playbook = &quot;playbooks/web.yml&quot;</text>
<text x="97" y="1864" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  end</text>
<text x="97" y="1892" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">end</text>
<circle cx="960" cy="1582" r="6" fill="#16A36A"/>
<text x="978" y="1590" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Une VM de dev identique pour toute</text>
<text x="978" y="1620" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">l&#x27;équipe.</text>
<circle cx="960" cy="1650" r="6" fill="#16A36A"/>
<text x="978" y="1658" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Utile pour tester Ansible sur de</text>
<text x="978" y="1688" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">vraies VM ou du multi-OS.</text>
<circle cx="960" cy="1718" r="6" fill="#16A36A"/>
<text x="978" y="1726" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Pour les applications modernes :</text>
<text x="978" y="1756" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">souvent remplacé par Compose et Dev</text>
<text x="978" y="1786" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Containers.</text>
<rect x="0" y="1955" width="1600" height="95" fill="#0F2F5A"/><text x="70" y="2014" font-size="30" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Golden image : on CONSTRUIT, SCANNE et REMPLACE — on ne patche pas à la main.</text>
</svg>