<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050">
<rect width="100%" height="100%" fill="#F4F6FA"/>
<rect width="1600" height="190" fill="#0F2F5A"/>
<text x="70" y="72" font-size="48" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Chapitre 16 — Terraform / OpenTofu</text>
<text x="70" y="125" font-size="27" font-weight="500" fill="#D7E8FF" font-family="Inter,Arial,sans-serif" text-anchor="start">Le modèle code ↔ state ↔ réalité, HCL, modules, state et CI</text>
<rect x="45" y="220" width="1510" height="340" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="220" width="1510" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="252" r="24" fill="#2563EB"/>
<text x="87" y="261" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="125" y="262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">1. Le triangle Terraform</text>
<text x="250" y="350" font-size="34" font-weight="800" fill="#2563EB" font-family="Inter,Arial,sans-serif" text-anchor="middle">CODE (.tf)</text>
<text x="800" y="350" font-size="34" font-weight="800" fill="#7C3AED" font-family="Inter,Arial,sans-serif" text-anchor="middle">STATE</text>
<text x="1350" y="350" font-size="34" font-weight="800" fill="#16A36A" font-family="Inter,Arial,sans-serif" text-anchor="middle">RÉALITÉ</text>
<text x="525" y="360" font-size="55" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="middle">⇄</text>
<text x="1075" y="360" font-size="55" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="middle">⇄</text>
<text x="250" y="405" font-size="23" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">ce que je veux</text>
<text x="800" y="405" font-size="23" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">ce que Terraform croit exister</text>
<text x="1350" y="405" font-size="23" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="middle">ce qui existe</text>
<text x="800" y="480" font-size="24" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="middle">plan = diff(code, state rafraîchi)    •    refresh = state ← réalité</text>
<rect x="45" y="590" width="730" height="600" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="590" width="730" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<circle cx="87" cy="622" r="24" fill="#2563EB"/>
<text x="87" y="631" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">2</text>
<text x="125" y="632" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">2. Commandes indispensables</text>
<rect x="75" y="685" width="670" height="364" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="97" y="723" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Cycle normal</text>
<text x="97" y="755" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform init</text>
<text x="97" y="789" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform fmt</text>
<text x="97" y="823" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform validate</text>
<text x="97" y="857" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform plan -out=tfplan</text>
<text x="97" y="891" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform apply tfplan</text>
<text x="97" y="925" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform state list</text>
<text x="97" y="959" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform state show aws_instance.web</text>
<text x="97" y="993" font-size="23" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform output -json</text>
<circle cx="85" cy="1037" r="6" fill="#16A36A"/>
<text x="103" y="1045" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">+ créer   ~ modifier   -/+ remplacer   - détruire</text>
<circle cx="85" cy="1076" r="6" fill="#16A36A"/>
<text x="103" y="1084" font-size="22" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">En prod : appliquer exactement le plan revu.</text>
<rect x="825" y="590" width="730" height="600" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="825" y="590" width="730" height="64" rx="24" fill="#F59E0B" opacity="0.12"/>
<circle cx="867" cy="622" r="24" fill="#F59E0B"/>
<text x="867" y="631" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">3</text>
<text x="905" y="632" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">3. HCL : exemple utile</text>
<rect x="855" y="685" width="670" height="512" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="877" y="723" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Exemple HCL</text>
<text x="877" y="755" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">terraform {</text>
<text x="877" y="785" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  backend &quot;s3&quot; {</text>
<text x="877" y="815" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    bucket  = &quot;crisisshield-tfstate&quot;</text>
<text x="877" y="845" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    key     = &quot;prod/network.tfstate&quot;</text>
<text x="877" y="875" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    region  = &quot;eu-west-3&quot;</text>
<text x="877" y="905" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    encrypt = true</text>
<text x="877" y="935" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  }</text>
<text x="877" y="965" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">}</text>
<text x="877" y="995" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="877" y="1025" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">resource &quot;aws_subnet&quot; &quot;this&quot; {</text>
<text x="877" y="1055" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  for_each   = var.subnets</text>
<text x="877" y="1085" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  vpc_id     = aws_vpc.main.id</text>
<text x="877" y="1115" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  cidr_block = each.value.cidr</text>
<text x="877" y="1145" font-size="20" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">}</text>
<rect x="45" y="1220" width="730" height="650" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="1220" width="730" height="64" rx="24" fill="#16A36A" opacity="0.12"/>
<circle cx="87" cy="1252" r="24" fill="#16A36A"/>
<text x="87" y="1261" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">4</text>
<text x="125" y="1262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">4. Modules et découpage</text>
<rect x="75" y="1310" width="670" height="389" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="97" y="1348" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">Organisation</text>
<text x="97" y="1380" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">infra/</text>
<text x="97" y="1413" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">├── modules/</text>
<text x="97" y="1446" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">│   ├── network/</text>
<text x="97" y="1479" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">│   ├── database/</text>
<text x="97" y="1512" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">│   └── service/</text>
<text x="97" y="1545" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">└── envs/</text>
<text x="97" y="1578" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    ├── dev/</text>
<text x="97" y="1611" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    ├── staging/</text>
<text x="97" y="1644" font-size="22" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    └── prod/</text>
<circle cx="85" cy="1642" r="6" fill="#16A36A"/>
<text x="103" y="1650" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Un module = une responsabilité + variables +</text>
<text x="103" y="1680" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">outputs.</text>
<circle cx="85" cy="1710" r="6" fill="#16A36A"/>
<text x="103" y="1718" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Un state par environnement et par domaine :</text>
<text x="103" y="1748" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">réseau, données, applications.</text>
<circle cx="85" cy="1778" r="6" fill="#16A36A"/>
<text x="103" y="1786" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">Éviter un state géant : rayon d&#x27;impact, lenteur et</text>
<text x="103" y="1816" font-size="21" font-weight="500" fill="#172033" font-family="Inter,Arial,sans-serif" text-anchor="start">blocage.</text>
<rect x="825" y="1220" width="730" height="650" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="825" y="1220" width="730" height="64" rx="24" fill="#7C3AED" opacity="0.12"/>
<circle cx="867" cy="1252" r="24" fill="#7C3AED"/>
<text x="867" y="1261" font-size="26" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">5</text>
<text x="905" y="1262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">5. Terraform dans la CI</text>
<rect x="865" y="1340" width="120" height="70" rx="14" fill="#2563EB" stroke="#2563EB" stroke-width="1"/>
<text x="925" y="1383" font-size="19" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">fmt/validate</text>
<text x="1003" y="1385" font-size="28" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="1000" y="1340" width="120" height="70" rx="14" fill="#F59E0B" stroke="#F59E0B" stroke-width="1"/>
<text x="1060" y="1383" font-size="19" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">scan IaC</text>
<text x="1138" y="1385" font-size="28" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="1135" y="1340" width="120" height="70" rx="14" fill="#7C3AED" stroke="#7C3AED" stroke-width="1"/>
<text x="1195" y="1383" font-size="19" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">plan</text>
<text x="1273" y="1385" font-size="28" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="1270" y="1340" width="120" height="70" rx="14" fill="#16A36A" stroke="#16A36A" stroke-width="1"/>
<text x="1330" y="1383" font-size="19" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">revue MR</text>
<text x="1408" y="1385" font-size="28" font-weight="800" fill="#8AA0B8" font-family="Inter,Arial,sans-serif" text-anchor="start">→</text>
<rect x="1405" y="1340" width="120" height="70" rx="14" fill="#DC2626" stroke="#DC2626" stroke-width="1"/>
<text x="1465" y="1383" font-size="19" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">apply</text>
<rect x="855" y="1460" width="670" height="389" rx="18" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
<text x="877" y="1498" font-size="24" font-weight="700" fill="#C9D1D9" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">GitLab CI — extrait</text>
<text x="877" y="1530" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">.tf-base:</text>
<text x="877" y="1557" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  image: hashicorp/terraform:1.9</text>
<text x="877" y="1584" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="877" y="1611" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">validate:</text>
<text x="877" y="1638" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  script:</text>
<text x="877" y="1665" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    - terraform fmt -check -recursive</text>
<text x="877" y="1692" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    - terraform validate</text>
<text x="877" y="1719" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start"></text>
<text x="877" y="1746" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">plan:</text>
<text x="877" y="1773" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">  script:</text>
<text x="877" y="1800" font-size="18" font-weight="500" fill="#E6EDF3" font-family="JetBrains Mono,Consolas,monospace" text-anchor="start">    - terraform plan -out=tfplan</text>
<rect x="0" y="1955" width="1600" height="95" fill="#0F2F5A"/><text x="70" y="2014" font-size="30" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Règle d&#x27;or : PLAN avant APPLY — et en production, APPLY uniquement depuis la CI.</text>
</svg>