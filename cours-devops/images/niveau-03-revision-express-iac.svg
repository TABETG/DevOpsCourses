<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2050" viewBox="0 0 1600 2050">
<rect width="100%" height="100%" fill="#F4F6FA"/>
<rect width="1600" height="190" fill="#0F2F5A"/>
<text x="70" y="72" font-size="48" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">Révision express — Infrastructure as Code</text>
<text x="70" y="125" font-size="27" font-weight="500" fill="#D7E8FF" font-family="Inter,Arial,sans-serif" text-anchor="start">Les réponses courtes à savoir donner en entretien</text>
<rect x="45" y="220" width="1510" height="1630" rx="24" fill="#F8FBFF" stroke="#D6E2F0" stroke-width="2"/>
<rect x="45" y="220" width="1510" height="64" rx="24" fill="#2563EB" opacity="0.12"/>
<text x="73" y="262" font-size="31" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">10 questions clés</text>
<circle cx="95" cy="302" r="28" fill="#2563EB"/>
<text x="95" y="311" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">1</text>
<text x="145" y="310" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Déclaratif vs impératif</text>
<text x="145" y="348" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Déclaratif : je décris l&#x27;état voulu, l&#x27;outil calcule les actions. Impératif : je liste</text>
<text x="145" y="376" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">les actions.</text>
<circle cx="95" cy="447" r="28" fill="#16A36A"/>
<text x="95" y="456" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">2</text>
<text x="145" y="455" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Provisioning vs configuration</text>
<text x="145" y="493" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Terraform crée l&#x27;infrastructure. Ansible configure ce qui tourne dessus.</text>
<circle cx="95" cy="592" r="28" fill="#F59E0B"/>
<text x="95" y="601" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">3</text>
<text x="145" y="600" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Code / state / réalité</text>
<text x="145" y="638" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Code = désiré, state = mémoire Terraform, réalité = API cloud. plan compare, apply</text>
<text x="145" y="666" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">exécute.</text>
<circle cx="95" cy="737" r="28" fill="#7C3AED"/>
<text x="95" y="746" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">4</text>
<text x="145" y="745" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Pourquoi protéger le state ?</text>
<text x="145" y="783" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Il contient les identifiants des ressources et parfois des secrets : backend distant,</text>
<text x="145" y="811" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">chiffré, versionné, verrouillé.</text>
<circle cx="95" cy="882" r="28" fill="#2563EB"/>
<text x="95" y="891" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">5</text>
<text x="145" y="890" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">count vs for_each</text>
<text x="145" y="928" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">count utilise des index fragiles ; for_each utilise des clés stables.</text>
<circle cx="95" cy="1027" r="28" fill="#16A36A"/>
<text x="95" y="1036" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">6</text>
<text x="145" y="1035" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">lifecycle</text>
<text x="145" y="1073" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">prevent_destroy, create_before_destroy, ignore_changes.</text>
<circle cx="95" cy="1172" r="28" fill="#F59E0B"/>
<text x="95" y="1181" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">7</text>
<text x="145" y="1180" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Réparer le state</text>
<text x="145" y="1218" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">import, state mv, moved, force-unlock ; jamais éditer le state à la main.</text>
<circle cx="95" cy="1317" r="28" fill="#7C3AED"/>
<text x="95" y="1326" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">8</text>
<text x="145" y="1325" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Idempotence Ansible</text>
<text x="145" y="1363" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Relancer un playbook ne doit rien changer si la cible est déjà conforme.</text>
<circle cx="95" cy="1462" r="28" fill="#2563EB"/>
<text x="95" y="1471" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">9</text>
<text x="145" y="1470" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">Golden image</text>
<text x="145" y="1508" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Packer construit, scanne et publie une image ; Terraform remplace les instances.</text>
<circle cx="95" cy="1607" r="28" fill="#16A36A"/>
<text x="95" y="1616" font-size="22" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="middle">10</text>
<text x="145" y="1615" font-size="26" font-weight="800" fill="#0F2F5A" font-family="Inter,Arial,sans-serif" text-anchor="start">GitOps</text>
<text x="145" y="1653" font-size="20" font-weight="500" fill="#55606F" font-family="Inter,Arial,sans-serif" text-anchor="start">Déclaratif + Git + pull par agent + réconciliation continue.</text>
<rect x="0" y="1955" width="1600" height="95" fill="#0F2F5A"/><text x="70" y="2014" font-size="30" font-weight="800" fill="#fff" font-family="Inter,Arial,sans-serif" text-anchor="start">À retenir : créer → configurer → fabriquer → remplacer → réconcilier.</text>
</svg>